<VirtualHost *:*>
    RequestHeader set "X-Forwarded-Proto" expr=%{REQUEST_SCHEME}
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
	# Reverse proxy uniquement : desactive le mode proxy avant (securite).
	ProxyRequests       Off
	# Reecrit REMOTE_ADDR avec l'IP client reelle pour les logs Apache.
	# Sans RemoteIPTrustedProxy, l'en-tete X-Forwarded-For fourni par le client
	# est ignore : seule la valeur calculee par Apache est fiable.
	RemoteIPHeader      X-Forwarded-For
	ProxyPreserveHost   On

	Timeout             300
	ProxyTimeout        300
	ProxyPassMatch      ^/_blazor/(.*) http://localhost:5033/_blazor/$1
	ProxyPass           /_blazor ws://localhost:5033/_blazor
	ProxyPass           / http://localhost:5033/
	ProxyPassReverse    / http://localhost:5033/

	ErrorLog /var/log/apache2/digiweek.error.log
	CustomLog /var/log/apache2/digiweek.access.log combined

	SSLCertificateFile /etc/letsencrypt/live/digiweek.cnead-mesrs.dz/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/digiweek.cnead-mesrs.dz/privkey.pem
	Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>

<VirtualHost *:80>
	# Reverse proxy uniquement : desactive le mode proxy avant (securite).
	ProxyRequests       Off
	# Reecrit REMOTE_ADDR avec l'IP client reelle pour les logs Apache.
	# Sans RemoteIPTrustedProxy, l'en-tete X-Forwarded-For fourni par le client
	# est ignore : seule la valeur calculee par Apache est fiable.
	RemoteIPHeader      X-Forwarded-For
	ProxyPreserveHost   On
	Timeout             300
	ProxyTimeout        300
	ProxyPassMatch      ^/_blazor/(.*) http://localhost:5033/_blazor/$1
	ProxyPass           /_blazor ws://localhost:5033/_blazor
	ProxyPass           / http://localhost:5033/
	ProxyPassReverse    / http://localhost:5033/    
	ServerName pes.univ-setif.dz
    
    
    ErrorLog /var/log/apache2/pes.error.log
    CustomLog /var/log/apache2/pes.access.log combined

RewriteEngine on
RewriteCond %{SERVER_NAME} =pes.univ-setif.dz
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

